<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Givrelune · banc d'essai audio</title>
    <style>
      body { font: 15px/1.45 system-ui, sans-serif; background: #141b33; color: #f3ead8; margin: 0; padding: 20px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      h2 { font-size: 15px; margin: 18px 0 6px; color: #f0c987; }
      p { margin: 0 0 12px; opacity: 0.8; }
      button { font: inherit; margin: 3px; padding: 5px 11px; border-radius: 14px; border: 1px solid #f0c98766; background: #233056; color: inherit; cursor: pointer; }
      button:hover { background: #2f3f70; }
      button.on { background: #b8413a; }
      pre { background: #0d1226; padding: 10px; border-radius: 8px; white-space: pre-wrap; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Givrelune · banc d'essai audio</h1>
    <p>Écoute chaque morceau, effet, ambiance et voix synthétisés. Le script <code>node scripts/audio-check.mjs</code> utilise cette page pour les rendus hors-ligne.</p>
    <h2>Musique</h2>
    <div id="songs"></div>
    <label><input type="checkbox" id="swell" /> swell (finale)</label>
    <label><input type="checkbox" id="duck" /> duck (dialogue)</label>
    <h2>Effets</h2>
    <div id="sfx"></div>
    <h2>Ambiances</h2>
    <div id="zones"></div>
    <h2>Voix</h2>
    <div id="voices"></div>
    <pre id="out"></pre>
    <script type="module" src="./__check__.ts"></script>
  </body>
</html>
